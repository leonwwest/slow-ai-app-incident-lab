name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      AI_API_KEY: ci-simulated-key
      ENABLE_TRACING: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Python syntax check
        run: |
          python -m compileall app scripts
          python -c "import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('app').rglob('*.py')]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Start app
        run: |
          python run.py &
          sleep 4

      - name: Health check
        run: |
          curl -fsS http://localhost:8010/health | grep -q '"status":"ok"'

      - name: Smoke test endpoints
        run: |
          curl -fsS -X POST http://localhost:8010/chat \
            -H "Content-Type: application/json" \
            -d '{"prompt":"ci smoke test"}' | grep -q "request_id"
          curl -fsS http://localhost:8010/db-query | grep -q "db_latency_ms"
          curl -fsSL http://localhost:8010/metrics | grep -q "http_requests"
          curl -fsS http://localhost:8010/api/triage | grep -q '"automation"'

      - name: Analyze script
        run: python scripts/analyze.py --hours 1
